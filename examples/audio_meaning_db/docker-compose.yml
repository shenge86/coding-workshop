services:
  backend:
    build: ./backend
    ports:
      - "8082:8080"
    volumes:
      - audio_store:/app/audio
      - chroma_data:/app/chroma_data
      - hf_cache:/root/.cache/huggingface
    environment:
      - ASR_MODEL=openai/whisper-base
      - TEXT_EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  audio_store:
  chroma_data:
  hf_cache:
